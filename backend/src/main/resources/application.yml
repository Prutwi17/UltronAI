server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ultronai-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ultronai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ultron_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ultron_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:ultron_mq}
    password: ${RABBITMQ_DEFAULT_PASS:ultron_mq_password}

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItdWx0cm9uYWktand0LWVudGVycHJpc2Utc2VjdXJpdHktc3BlY2lmaWNhdGlvbg==}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

fastapi:
  nlp:
    url: ${FASTAPI_NLP_URL:http://localhost:8000}
